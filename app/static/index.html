<!-- FLOATING PROTOTYPE SWITCHER WIDGET (Can be minimized on the right side of the screen) -->
<div id="proto-widget">
  <!-- Minimized Trigger Pill -->
  <button id="proto-widget-btn" onclick="toggleProtoWidget()" style="display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--border-subtle);border:1px solid var(--ink-2b);border-radius:999px;padding:7px 14px 7px 12px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.25);transition: background-color 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, opacity 0.15s, transform 0.15s;backdrop-filter:blur(8px)" onmouseover="this.style.background='var(--ink-hover)';this.style.borderColor='var(--ink-3)'" onmouseout="this.style.background='var(--ink)';this.style.borderColor='var(--ink-2b)'" title="Open screen and persona menu">
    <div style="width:7px;height:7px;border-radius:50%;background:var(--open-line-2);box-shadow:0 0 8px var(--open-line-2)"></div>
    <span style="color:var(--ink-muted)">Screen:</span>
    <span id="proto-widget-current-screen" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">01 · Start (/)</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- Expanded Card -->
  <div id="proto-widget-card" style="display:none;width:300px;background:var(--ink);color:var(--border-subtle);border:1px solid var(--ink-2b);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,0.35);flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--ink-hover)">
      <div style="display:flex;align-items:center;gap:8px">
        <img src="/static/assets/novaliners-mark.png" alt="Novaliners" style="height:16px;width:auto;display:inline-block;object-fit:contain" onerror="this.style.display='none'">
        <span style="font-size:12px;font-weight:700;color:var(--on-ink)">Novaliners Dev</span>
        <span style="font-size:9.5px;padding:1px 6px;border-radius:4px;background:var(--ink-hover);color:var(--ink-muted);font-weight:600">v11</span>
      </div>
      <button onclick="toggleProtoWidget()" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-muted);padding:3px 8px;border-radius:6px;background:var(--ink-hover);border:1px solid var(--ink-2b);cursor:pointer;transition: background-color 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, opacity 0.15s, transform 0.15s" onmouseover="this.style.color='var(--on-ink)';this.style.background='var(--ink-2b)'" onmouseout="this.style.color='var(--ink-muted)';this.style.background='var(--ink-hover)'" title="Minimize">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
        <span>Minimize</span>
      </button>
    </div>

    <!-- Screen Selector -->
    <div style="display:flex;flex-direction:column;gap:5px">
      <label style="font-size:11px;font-weight:600;color:var(--ink-muted);display:flex;justify-content:space-between">
        <span>Switch screen:</span>
        <span style="font-size:10px;color:var(--ink-3)">Testing Flow</span>
      </label>
      <select id="screen-selector" onchange="widgetGo(this.value);updateProtoWidgetLabel()" style="width:100%;background:var(--ink-hover);color:var(--on-ink);border:1px solid var(--ink-2b);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--font-ui);outline:none;cursor:pointer">
        <optgroup label="V11 PRODUCT">
          <option value="state" selected>State</option>
          <option value="maps">Maps · Explore</option>
          <option value="maps:readiness">Maps · Readiness</option>
          <option value="moves">Moves</option>
          <option value="journey">Journey</option>
          <option value="talk">Talk</option>
        </optgroup>
        <optgroup label="Entry flow and check-in scenes">
          <option value="01">01 · Start (/)</option>
          <option value="02">02 · Talk interview (/diagnosis)</option>
          <option value="03">03 · Diagnosis reveal (/diagnosis/result)</option>
          <option value="13">13 · Provisional diagnosis (Rina)</option>
          <option value="15">15 · Safety first (Bayu)</option>
          <option value="05">05 · Weekly check-in (/check-in)</option>
          <option value="06a">06a · Map updated · New path</option>
          <option value="06b">06b · Map adjusted · No replies</option>
          <option value="12">12 · Map adjusted · Mixed result</option>
          <option value="14">14 · Welcome back</option>
          <option value="16">16 · Day 90 review</option>
        </optgroup>
        <optgroup label="Overlays &amp; contrast">
          <option value="09">09 · Why? reasoning trace (drawer)</option>
          <option value="11">11 · Doing a stopped path (modal)</option>
          <option value="10">10 · Same question, opposite answers</option>
        </optgroup>
      </select>
    </div>

    <!-- 90-day simulation -->
    <div style="display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--ink-hover);border-bottom:1px solid var(--ink-hover)">
      <label style="font-size:11px;font-weight:600;color:var(--ink-muted);display:flex;justify-content:space-between">
        <span>Simulate 90 days:</span>
        <span id="sim-status" style="font-size:10.5px;color:var(--open-on-ink)">Cycle 1 · Day 3 · Rp0M</span>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button onclick="simulateNextCycle()" style="background:var(--ink-hover);color:var(--on-ink);border:1px solid var(--ink-2b);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer">Next cycle →</button>
        <button onclick="simulateToDay90('miss')" style="background:var(--ink-hover);color:var(--on-ink);border:1px solid var(--ink-2b);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer">Jump to Day 90</button>
        <button onclick="simulateToDay90('success')" style="background:var(--ink-hover);color:var(--open-on-ink);border:1px solid var(--ink-2b);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer">Success ending</button>
        <button onclick="resetSimulation()" style="background:transparent;color:var(--ink-muted);border:1px solid var(--ink-2b);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer">Reset</button>
        <button onclick="advanceDemoDay()" style="grid-column:1 / -1;background:var(--ink-hover);color:var(--on-ink);border:1px solid var(--ink-2b);border-radius:7px;padding:6px 8px;font-size:11.5px;font-weight:600;cursor:pointer">Next day →</button>
      </div>
    </div>

    <!-- Persona Selector -->
    <div style="display:flex;flex-direction:column;gap:5px">
      <label style="font-size:11px;font-weight:600;color:var(--ink-muted)">Test persona:</label>
      <select id="persona-selector" onchange="setPersona(this.value)" style="width:100%;background:var(--ink-hover);color:var(--on-ink);border:1px solid var(--ink-2b);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--font-ui);outline:none;cursor:pointer">
        <option value="dimas">Dimas A. (Main persona)</option>
        <option value="rina">Rina W. (Zero Open / Provisional)</option>
        <option value="arif">Arif S. (Capacity / Several Open)</option>
        <option value="bayu">Bayu (Safety First / Low savings)</option>
      </select>
    </div>
  </div>
</div>
